<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Iniciada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff; /* Fondo blanco puro */
        }

        /* El círculo negro del centro */
        .success-circle {
            width: 150px;
            height: 150px;
            background-color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
        }

        /* El checkmark blanco (usando un SVG simple) */
        .checkmark {
            width: 70px;
            height: 70px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }
        .btn-next {
            background-color: rgba(58, 108, 186, 0.69);
            border: none;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(59, 153, 246, 0.3);
            position: fixed;
            bottom: 20px;       /* Distancia desde el borde inferior */
            left: 50%;          /* Lo movemos al centro */
            transform: translateX(-50%); /* Ajuste para centrado perfecto */
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

<div class="container text-center">
    <div class="d-flex justify-content-center">
        <div class="success-circle">
            <svg class="checkmark" viewBox="0 0 24 24">
                <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <h2 class="fw-bold mb-4">Se inicio sesion correctamente</h2>

    <p class="text-secondary fs-5">
        Has iniciado sesion a tu cuenta <br> de manera correcta
    </p>
    <!--    <div class="mt-auto pt-5">-->
    <!--        <button type="submit" class="btn btn-primary btn-next w-100">Continuar</button>-->
    <!--    </div>-->
</div>

</body>
</html>
