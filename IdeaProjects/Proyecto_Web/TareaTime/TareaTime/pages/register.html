<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">

</head>
<body class="body-registro">
<div class="tarjeta-login">
    <h2 class="titulo-login">
        REGISTRAR CUENTA
    </h2>
    <form>
        <div class="mb-3">
            <label class="etiqueta">
                Usuario:
            </label>
            <input type="email" class="form-control entrada-texto" placeholder="correo@gmail.com">
        </div>
        <div class="mb-3">
            <label class="etiqueta">
                Contraseña:
            </label>
            <input type="password" class="form-control entrada-texto" placeholder="••••••••" >
        </div>
        <div class="text-center">
            <button type="submit" class="btn boton-login">
                Registrar
            </button>
        </div>
        <a href="../../index.html" class="crear-cuenta">
            Iniciar Sesion

        </a>
    </form>
</div>
</body>
</html>
