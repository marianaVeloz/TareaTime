<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Práctica Sistemas Operativos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="tarjeta-login">
    <h2 class="titulo-login">LOGIN</h2>

    <form>
        <div class="mb-3">
            <label class="etiqueta">Usuario:</label>
            <input type="email" class="form-control entrada-texto" placeholder="correo@gmail.com">
        </div>

        <div class="mb-3">
            <label class="etiqueta">Contraseña:</label>
            <input type="password" class="form-control entrada-texto" placeholder="••••••••">
        </div>

        <div class="text-center">
            <button type="button" class="btn boton-login w-100" onclick="window.location.href='pages/post_correct.html'">
                Iniciar sesión
            </button>
        </div>

        <a href="pages/register.html" class="crear-cuenta">
            ¿No tienes cuenta? Crear cuenta
        </a>
    </form>
</div>

</body>
</html>
